[workspace]
members = ["crates/rfc5321", "crates/mailparsing", "crates/dkim", "crates/dns-resolver", "crates/mta-sts", "crates/kumo-tls-helper", "crates/lruttl", "crates/kumo-prometheus", "crates/kumo-address", "crates/kumo-wrap", "crates/duration-serde", "crates/nom-utils"]
resolver = "2"

[workspace.lints.clippy]
all = "allow"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "1.6"
async-stream = "0.3"
async-trait = "0.1"
bitflags = "2.11"
bstr = {version="1.12", features=["serde"]}
charset-normalizer-rs = { git = "https://github.com/KumoCorp/charset-normalizer-rs.git", rev="1f1dc21b49d30d73a99b0136497352b569947ac2" }
chrono = { version = "0.4.26", default-features = false }
criterion = "0.7"
dashmap = "6.1"
data-encoding = "2.6"
data-encoding-macro = "0.1"
ed25519-dalek = "2.0"
foreign-types = "0.3" # sync with openssl
futures = "0.3.28"
hickory-resolver = {version="=0.26.3", features=["dnssec-aws-lc-rs"]}
hickory-proto = {version="=0.26.3", features=["dnssec-aws-lc-rs"]}
humantime = "2.1"
idna = "1.0.3"
indexmap = "2.2"
k9 = "0.12"
libc = "0.2.139"
linkme = "0.3"
libunbound = {git="https://github.com/KumoCorp/libunbound-rs.git", rev="0d7d5c89f7ad02c7eabd0805a92b71eaaf37b5d5"}
map_vec = "0.6"
memchr = "2.5"
mlua = "0.11"
nom = "8.0.0"
nom_locate = "5.0"
openssl = { version="=0.10.80" } # pinned; see patch below
openssl-sys = { version="0.9" }
parking_lot = "0.12"
pastey = "0.1"
prometheus = "0.14"
quoted_printable = "0.5"
rand = "0.8"
reqwest = {version="0.12", default-features=false, features=["rustls-tls", "rustls-tls-native-roots"]}
rustls = "0.23"
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.5"
scopeguard = "1.2"
serde = {version="1.0", features=["derive"]}
serde_json = "1.0"
serde_with = "3.4"
sha-1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
test-log = {version="0.2", features = ["trace"]}
thiserror = "2"
tokio = "^1.49"
tokio-openssl = "0.6.4"
tokio-rustls = "0.26"
tracing = "0.1"
uuid = "1.23.1"

[patch.crates-io]
hickory-net = { git = "https://github.com/ONREZA/hickory-dns.git", rev = "d7fd3facf030ba0769cfc97df4ffc56ba570a1b1" }
hickory-resolver = { git = "https://github.com/ONREZA/hickory-dns.git", rev = "d7fd3facf030ba0769cfc97df4ffc56ba570a1b1" }
hickory-proto = { git = "https://github.com/ONREZA/hickory-dns.git", rev = "d7fd3facf030ba0769cfc97df4ffc56ba570a1b1" }
openssl = { git = "https://github.com/KumoCorp/rust-openssl.git", rev = "6c36e1c3f61d9393736dafdc51fda8f01f209555" }
openssl-sys = { git = "https://github.com/KumoCorp/rust-openssl.git", rev = "6c36e1c3f61d9393736dafdc51fda8f01f209555" }
